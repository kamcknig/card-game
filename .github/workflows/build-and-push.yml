# Builds and pushes Docker images to Azure Container Registry when a GitHub release is published.
name: Build and Push Docker Images

on:
  release:
    types: [published]

jobs:
  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Sets up a buildx builder using the docker driver (pre-installed on the
      # runner). Avoids pulling the buildkit image from Docker Hub, which is
      # prone to rate-limit failures on shared GHA runner IPs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # Generates two tags: the release tag (e.g., v1.0.0) for traceability and
      # `latest` for deployment convenience.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-server
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/DockerFile_server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Sets up a buildx builder using the docker driver (pre-installed on the
      # runner). Avoids pulling the buildkit image from Docker Hub, which is
      # prone to rate-limit failures on shared GHA runner IPs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # Generates two tags: the release tag (e.g., v1.0.0) for traceability and
      # `latest` for deployment convenience.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/DockerFile_web_app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
