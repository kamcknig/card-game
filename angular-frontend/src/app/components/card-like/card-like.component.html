<!-- Card-like layout: top accent strip carrying the card name + naturally-
     sized image + bottom filler bar (same kind-keyed colour) that absorbs
     remaining vertical space and hosts the optional cost cluster. -->
@let model = cardLike();
<div
  class="card-like-frame"
  [style]="hostStyle()"
  (contextmenu)="onContextMenu($event)"
>
  @if (showAccentStrip()) {
    <div class="card-like-accent-strip">
      @if (model) {
        <span class="card-like-name" [title]="model.cardName">{{ model.cardName }}</span>
      }
    </div>
  }

  <div class="card-like-art">
    <img
      class="card-like-art-image"
      [src]="path() ?? ''"
      (error)="onImageError()"
      alt=""
    />
  </div>

  <div class="card-like-art-frame-bottom">
    @if (showCost()) {
      <div class="card-like-cost-cluster">
        <div class="card-like-cost-badge">{{ treasureCost() }}</div>
        @if (potionCost() > 0) {
          <div class="card-like-cost-chip card-like-cost-chip-potion">
            <img src="/assets/ui-icons/potion.png" alt="" />
            @if (potionCost() > 1) { <span>{{ potionCost() }}</span> }
          </div>
        }
        @if (debtCost() > 0) {
          <div class="card-like-cost-chip">
            <img src="/assets/ui-icons/debt-icon.png" alt="" />
            <span>{{ debtCost() }}</span>
          </div>
        }
      </div>
    }
  </div>
</div>
