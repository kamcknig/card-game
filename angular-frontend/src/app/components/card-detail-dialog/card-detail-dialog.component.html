@if (isOpen()) {
  <app-ui-dialog
    [zIndex]="5000"
    [backdropVariant]="'strong'"
    (close)="closeDetailDialog()"
  >
    <div
      class="card-detail-panel"
      (mousedown)="onPanelMouseDown($event)"
      (contextmenu)="onPanelContextMenu($event)"
    >
      @for (detailPath of detailImagePaths(); track detailPath) {
        <img class="card-detail-image" [src]="detailPath" alt="Card detail" draggable="false" />
      }
    </div>
  </app-ui-dialog>
}
