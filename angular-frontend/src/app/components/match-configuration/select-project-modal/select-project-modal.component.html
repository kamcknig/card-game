<div class="modal-container">
  <div class="card-content">
    <!-- Close button for the project selection modal -->
    <div (click)="searchTermInput.value = ''; onClose()" class="close-button">X</div>
    <div class="card-container">
      @for (project of searchResults$ | async; track project.cardKey) {
        <img
          (click)="onProjectSelected(project); searchTermInput.value = ''"
          [ngSrc]="project.fullImagePath"
          height="{{EVENT_CARD_HEIGHT}}"
          width="{{EVENT_CARD_WIDTH}}"
          class="card-image">
      }
    </div>
  </div>

  <!-- Search input for projects -->
  <input
    #searchTermInput
    autofocus
    (input)="updateSearchTerm(searchTermInput.value)"
    type="text">
</div>
