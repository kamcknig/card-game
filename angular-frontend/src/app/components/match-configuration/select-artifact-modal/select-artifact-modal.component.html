<div class="modal-container">
  <div class="card-content">
    <!-- Close button for the artifact selection modal -->
    <div (click)="searchTermInput.value = ''; onClose()" class="close-button">X</div>
    <div class="card-container">
      @for (artifact of searchResults$ | async; track artifact.cardKey) {
        <img
          (click)="onArtifactSelected(artifact); searchTermInput.value = ''"
          [ngSrc]="artifact.fullImagePath"
          height="{{EVENT_CARD_HEIGHT}}"
          width="{{EVENT_CARD_WIDTH}}"
          class="card-image">
      }
    </div>
  </div>

  <!-- Search input for artifacts -->
  <input
    #searchTermInput
    autofocus
    (input)="updateSearchTerm(searchTermInput.value)"
    type="text">
</div>
