<app-scene-content>
  <!-- Back button projected into the banner header actions area. -->
  <button sceneHeaderActions type="button" class="btn btn-secondary back-button" (click)="backToLobby()">
    Back to Lobby
  </button>

  <section class="profile-shell">
    <aside class="profile-nav">
      <button
        type="button"
        class="nav-button"
        routerLink="security"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        #secLink="routerLinkActive"
        [attr.aria-pressed]="secLink.isActive"
      >
        Security
      </button>
      <button
        type="button"
        class="nav-button"
        routerLink="settings"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        #settingsLink="routerLinkActive"
        [attr.aria-pressed]="settingsLink.isActive"
      >
        Settings
      </button>
    </aside>

    <main class="profile-content">
      <router-outlet />
    </main>
  </section>
</app-scene-content>
