server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers injected at container start (see docker/env.sh).
    # The file is generated dynamically so the CSP can be regenerated on a
    # restart without rebuilding the image. Written to snippets/ so nginx's
    # main config wildcard (conf.d/*.conf at http level) does not re-include it.
    include /etc/nginx/snippets/security-headers.conf;

    # Backend proxy locations (also generated by docker/env.sh from $WS_HOST).
    # Forwards /auth/, /socket.io/, /debug/, and /status to the game server so
    # the browser only ever talks to this nginx origin. Keeps these forwards
    # in sync with angular-frontend/src/proxy.conf.json used by `ng serve`.
    # Written to snippets/ for the same reason as security-headers.conf above.
    include /etc/nginx/snippets/proxy-locations.conf;

    # SPA fallback for client-side routes — must come AFTER the proxy
    # includes so /auth, /socket.io, /debug, /status are matched first.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
