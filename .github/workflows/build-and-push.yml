# Builds and pushes Docker images to GitHub Container Registry (GHCR) when
# a component-prefixed GitHub release is published. The release tag selects
# which component is built:
#   - tag `server-vX.Y.Z`   → builds dominion-clone-server only
#   - tag `frontend-vX.Y.Z` → builds dominion-clone-frontend only
# The component prefix is stripped from the resulting image tag, so a
# `server-v1.2.3` release publishes
# `ghcr.io/<owner>/dominion-clone-server:1.2.3` and also updates the
# floating `:latest` tag for convenience pulls on the Unraid host.
name: Build and Push Docker Images

on:
  release:
    types: [published]

jobs:
  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'server-v')
    # GHCR pushes use the workflow's GITHUB_TOKEN; packages:write grants it
    # the right to push to ghcr.io/<owner>/<repo-or-image>.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to the docker driver to skip a buildkit image pull on the
      # shared runner IP pool (rate-limit-prone). Same rationale as before.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # Publishes the bare semver (e.g. 1.2.3 from server-v1.2.3) AND the
      # floating :latest tag. Unraid pins exact tags via .env
      # (SERVER_VERSION) for deterministic rolls; :latest is a convenience
      # fallback when SERVER_VERSION is unset / on a fresh host.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dominion-clone-server
          tags: |
            type=match,pattern=^server-v(\d+\.\d+\.\d+)$,group=1
            type=raw,value=latest

      # Stamp the release semver into server/deno.json so SERVER_VERSION
      # (resolved at runtime from that file via server/src/version.ts) matches
      # the image tag. Edit only happens inside the runner's workspace — never
      # committed back to git; the dev keeps source files at whatever the
      # repo's working version is.
      #
      # Uses sed (not jq) because deno.json is CRLF-terminated in this repo
      # and a full-file rewrite via jq converts to LF — which Deno's import
      # resolver treats as a different file and rejects local path imports
      # ("Import shared/types/... not a dependency"). sed -i edits a single
      # line in place and leaves the rest of the file's bytes (including the
      # CRLF endings everywhere else) untouched.
      - name: Stamp server version into deno.json
        run: |
          VERSION='${{ steps.meta.outputs.version }}'
          if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            echo "::error::No semver tag resolved from release tag '${{ github.event.release.tag_name }}'; refusing to stamp."
            exit 1
          fi
          sed -i -E 's/("version"[[:space:]]*:[[:space:]]*")[^"]*(")/\1'"$VERSION"'\2/' server/deno.json
          echo "Stamped server/deno.json with version $VERSION"
          grep '"version"' server/deno.json

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/DockerFile_server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'frontend-v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to the docker driver to skip a buildkit image pull on the
      # shared runner IP pool (rate-limit-prone). Same rationale as before.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # Publishes the bare semver (e.g. 1.2.3 from frontend-v1.2.3) AND the
      # floating :latest tag. Unraid pins exact tags via .env
      # (FRONTEND_VERSION) for deterministic rolls; :latest is a convenience
      # fallback when FRONTEND_VERSION is unset / on a fresh host.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dominion-clone-frontend
          tags: |
            type=match,pattern=^frontend-v(\d+\.\d+\.\d+)$,group=1
            type=raw,value=latest

      # Stamp the release semver into angular-frontend/package.json so
      # APP_VERSION (resolved at build time from that file via
      # angular-frontend/src/app/core/app-version.ts) matches the image tag.
      # Edit only happens inside the runner's workspace — never committed back
      # to git; the dev keeps source files at whatever the repo's working
      # version is.
      #
      # Uses sed for the same reason as the server step: avoid rewriting the
      # whole file's bytes (preserves the existing CRLF/LF line-ending
      # convention).
      - name: Stamp frontend version into package.json
        run: |
          VERSION='${{ steps.meta.outputs.version }}'
          if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            echo "::error::No semver tag resolved from release tag '${{ github.event.release.tag_name }}'; refusing to stamp."
            exit 1
          fi
          sed -i -E 's/("version"[[:space:]]*:[[:space:]]*")[^"]*(")/\1'"$VERSION"'\2/' angular-frontend/package.json
          echo "Stamped angular-frontend/package.json with version $VERSION"
          grep '"version"' angular-frontend/package.json

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/DockerFile_web_app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
