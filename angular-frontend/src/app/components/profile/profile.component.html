<app-scene-content>
  <!-- Back button projected into the banner header actions area. -->
  <button sceneHeaderActions type="button" class="btn btn-secondary" (click)="backToLobby()">
    Back to Lobby
  </button>

  <section class="profile-shell">
    <aside class="profile-nav">
      <button
        type="button"
        class="nav-button"
        routerLink="/profile"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        #profileLink="routerLinkActive"
        [attr.aria-pressed]="profileLink.isActive"
      >
        Profile
      </button>
      <button
        type="button"
        class="nav-button"
        routerLink="/settings"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        #settingsLink="routerLinkActive"
        [attr.aria-pressed]="settingsLink.isActive"
      >
        Settings
      </button>
    </aside>

    <main class="profile-content">
      <router-outlet />
    </main>
  </section>
</app-scene-content>
