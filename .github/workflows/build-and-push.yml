# Builds and pushes Docker images to Azure Container Registry when a
# component-prefixed GitHub release is published. The release tag selects
# which component is built:
#   - tag `server-vX.Y.Z`   → builds dominion-clone-server only
#   - tag `frontend-vX.Y.Z` → builds dominion-clone-frontend only
# The component prefix is stripped from the resulting image tag, so a
# `server-v1.2.3` release publishes `dominion-clone-server:1.2.3` (and
# `:latest`).
name: Build and Push Docker Images

on:
  release:
    types: [published]

jobs:
  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'server-v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Sets up a buildx builder using the docker driver (pre-installed on the
      # runner). Avoids pulling the buildkit image from Docker Hub, which is
      # prone to rate-limit failures on shared GHA runner IPs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # Generates two tags: the stripped semver (e.g., 1.2.3 from
      # server-v1.2.3) for traceability and `latest` for deployment
      # convenience. The match pattern captures group(1) as the version,
      # dropping the `server-v` prefix so the image carries a clean tag.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-server
          tags: |
            type=match,pattern=^server-v(\d+\.\d+\.\d+)$,group=1
            type=raw,value=latest

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/DockerFile_server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'frontend-v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Sets up a buildx builder using the docker driver (pre-installed on the
      # runner). Avoids pulling the buildkit image from Docker Hub, which is
      # prone to rate-limit failures on shared GHA runner IPs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # Generates two tags: the stripped semver (e.g., 1.2.3 from
      # frontend-v1.2.3) for traceability and `latest` for deployment
      # convenience. The match pattern captures group(1) as the version,
      # dropping the `frontend-v` prefix so the image carries a clean tag.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-frontend
          tags: |
            type=match,pattern=^frontend-v(\d+\.\d+\.\d+)$,group=1
            type=raw,value=latest

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/DockerFile_web_app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
