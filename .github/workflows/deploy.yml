# Deploys updated Docker images to Azure Container Apps after a successful
# build-and-push run triggered by a published GitHub release. Both the server
# and frontend apps are updated in sequence, and the new revision name is
# logged for traceability.
name: Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    # Only deploy when the upstream build-and-push workflow succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Force Node.js 24 for actions that don't yet have a Node 24 native release (azure/container-apps-deploy-action).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Derives the release tag name from the upstream build-and-push workflow.
      # For release-triggered runs, head_branch is the tag name (e.g., v1.0.0),
      # matching the tag generated by docker/metadata-action (type=ref,event=tag).
      - name: Resolve image tag
        id: tag
        run: |
          echo "release_tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

      # Deploys the release-tagged server image to the dominion-clone-server container app.
      # Using a unique release tag (instead of `latest`) ensures Azure creates a new revision.
      - name: Deploy server container app
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.AZURE_SERVER_APP_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-server:${{ steps.tag.outputs.release_tag }}
          registryUrl: ${{ secrets.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}

      # Deploys the release-tagged frontend image to the dominion-clone-frontend container app.
      - name: Deploy frontend container app
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-frontend:${{ steps.tag.outputs.release_tag }}
          registryUrl: ${{ secrets.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}

      # Logs the active revision name for the server app to confirm deployment.
      - name: Verify server deployment
        run: |
          az containerapp show \
            --name ${{ secrets.AZURE_SERVER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.latestRevisionName" -o tsv

      # Logs the active revision name for the frontend app to confirm deployment.
      - name: Verify frontend deployment
        run: |
          az containerapp show \
            --name ${{ secrets.AZURE_FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.latestRevisionName" -o tsv
