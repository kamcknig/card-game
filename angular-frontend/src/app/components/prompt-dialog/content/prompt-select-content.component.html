<div class="prompt-select-content" #promptRoot>
  @if (cardEntries().length > 0) {
    <div class="selection-row">
      @for (entry of cardEntries(); track entry.key) {
        <button
          type="button"
          class="selection-entry"
          [class.selectable]="entry.selectable && !displayOnly()"
          [class.selected]="isSelected(entry)"
          [class.non-selectable]="!entry.selectable && !displayOnly()"
          (mouseenter)="onEntryMouseEnter(entry, $event)"
          (mouseleave)="onEntryMouseLeave(entry)"
          (click)="toggleEntry(entry)">
          <app-card
            [cardId]="entry.sourceId"
            [forceFacing]="entry.forceFacing"
          ></app-card>
        </button>
      }
    </div>
  }

  @if (cardLikeEntries().length > 0) {
    <div class="selection-row card-like-row">
      @for (entry of cardLikeEntries(); track entry.key) {
        <button
          type="button"
          class="selection-entry"
          [class.selectable]="entry.selectable && !displayOnly()"
          [class.selected]="isSelected(entry)"
          [class.non-selectable]="!entry.selectable && !displayOnly()"
          (click)="toggleEntry(entry)">
          <app-card-like
            [cardLikeId]="entry.sourceId"
          ></app-card-like>
        </button>
      }
    </div>
  }

  @if (showWayTooltip()) {
    <app-way-picker-panel
      class="way-picker"
      [style.left.px]="wayTooltipPosition().left"
      [style.top.px]="wayTooltipPosition().top"
      [wayIds]="sortedWayIds()"
      [selectedWayId]="selectedWayId()"
      [scrollable]="true"
      (waySelected)="selectWay($event)"
      (mouseenter)="onWayTooltipMouseEnter()"
      (mouseleave)="onWayTooltipMouseLeave()">
    </app-way-picker-panel>
  }
</div>
