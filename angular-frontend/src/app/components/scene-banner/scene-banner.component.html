<header class="scene-banner-header">
  <!-- Decorative banner image. The version pill is positioned absolutely
       within the banner so it stays beneath the title/subtitle and
       bottom-anchors against the banner image's lower edge. -->
  <div class="scene-banner" role="img" aria-label="Dominion Clone banner">
    <h1>Dominion Clone</h1>
    @if (subtitle()) {
      <p>{{ subtitle() }}</p>
    }
    <span class="version-pill" [title]="versionLine()">{{ versionLine() }}</span>
  </div>

  <!-- Action bar below the banner -->
  <nav class="scene-action-bar">
    <div class="action-bar-left">
      <ng-content select="[sceneNavActions]"></ng-content>
    </div>
    <div class="action-bar-right">
      <div class="action-bar-projected">
        <ng-content></ng-content>
      </div>
      <span class="action-bar-divider"></span>
      <app-theme-toggle />
      @if (username()) {
        <span class="action-bar-divider"></span>
        <app-profile-menu />
      }
    </div>
  </nav>
</header>
