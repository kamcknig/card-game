<section class="scene-content-shell">
  <app-scene-banner [subtitle]="subtitle()">
    <!-- Re-project nav actions (left side of action bar) -->
    <ng-container ngProjectAs="[sceneNavActions]">
      <ng-content select="[sceneNavActions]"></ng-content>
    </ng-container>
    <!-- Re-project header actions (right side of action bar) -->
    <ng-content select="[sceneHeaderActions]"></ng-content>
  </app-scene-banner>

  <section class="scene-content-body">
    <ng-content></ng-content>
  </section>
</section>
