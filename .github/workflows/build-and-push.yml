# Builds Docker images on PRs to master (validation only) and builds+pushes to
# Azure Container Registry on merge to master. GitHub Actions layer caching
# keeps the post-merge rebuild fast since layers are already warm from the PR run.
name: Build and Push Docker Images

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Generates two tags: a short SHA tag for traceability and `latest` for
      # deployment convenience. Tags are only used when pushing (merge to master).
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-server
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/DockerFile_server
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Generates two tags: a short SHA tag for traceability and `latest` for
      # deployment convenience. Tags are only used when pushing (merge to master).
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/DockerFile_web_app
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
