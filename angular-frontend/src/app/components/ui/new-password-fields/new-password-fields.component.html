<label class="form-field">
  <span class="form-label">{{ primaryLabel() }}</span>
  <div class="form-input-wrapper">
    <input
      [type]="showPassword() ? 'text' : 'password'"
      class="form-input"
      [value]="primary()"
      (input)="primary.set($any($event.target).value)"
      [attr.autocomplete]="primaryAutocomplete()"
    />
    <button
      type="button"
      class="form-input-toggle"
      (click)="toggleShowPassword()"
      [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
    >
      <lucide-icon [img]="showPassword() ? EyeOffIcon : EyeIcon" [size]="18" />
    </button>
  </div>
</label>

<label class="form-field">
  <span class="form-label">{{ confirmLabel() }}</span>
  <input
    [type]="showPassword() ? 'text' : 'password'"
    class="form-input"
    [value]="confirm()"
    (input)="confirm.set($any($event.target).value)"
    [disabled]="primary().length === 0"
    [attr.autocomplete]="confirmAutocomplete()"
  />
  @if (mismatch()) {
    <p class="form-field-error">Passwords do not match</p>
  }
</label>
