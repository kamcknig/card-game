# Production Docker Compose — for local production testing and reference.
# In production, Azure Container Apps handles orchestration.
services:
  frontend:
    build:
      context: .
      dockerfile: docker/DockerFile_web_app
    ports:
      - "80:80"
    environment:
      # Upstream backend URL used by nginx proxying for /auth, /socket.io,
      # /debug, and /status. The browser only ever talks to this nginx
      # origin, so wsHost in env.js is left as ''. Set this to the docker
      # compose service hostname so nginx can resolve the server container
      # internally.
      WS_HOST: "http://server:3000"
    restart: unless-stopped
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: docker/DockerFile_server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      LOG_TO_FILE: "true"
      GAME_DATA_ROOT: "./game-data"
      MATCH_STATE_EXPORT_ENABLED: "true"
      END_MATCH_ON_NO_HUMANS: "true"
      LOG_COLOR: "true"
      AUTH_ALLOWED_ORIGINS: "http://localhost"
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: "10"
      AUTH_RATE_LIMIT_WINDOW_MS: "60000"
      STORAGE_BACKEND: "supabase"
      # Required for Supabase backend. Set these in your production environment.
      # SUPABASE_URL: ""
      # SUPABASE_SERVICE_ROLE_KEY: ""
    restart: unless-stopped
