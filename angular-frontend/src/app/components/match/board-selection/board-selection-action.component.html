@if (state().visible) {
  <div class="board-selection-overlay-root">
    <section class="board-selection-controls">
      @if (state().optional) {
        <button
          type="button"
          class="btn btn-danger"
          (click)="onCancel()"
        >
          Cancel
        </button>
      }
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="!state().submitEnabled"
        (click)="onSubmit()"
      >
        {{ state().prompt }}
      </button>
    </section>
  </div>
}
