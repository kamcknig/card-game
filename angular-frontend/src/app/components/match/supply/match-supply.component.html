@if (visible()) {
  @let layout = supplyLayout();
  <div class="supply-overlay-root">
    <section
      class="supply-panel"
      [style.left.px]="layout.basicLeft"
      [style.top.px]="layout.basicTop"
    >
      <div class="basic-columns">
        <div class="pile-column">
          @for (pile of basicVictoryPiles(); track pile.trackKey) {
            <button
              type="button"
              class="supply-pile"
              [class.selectable-card]="pile.selectableCard"
              [class.selected-card]="pile.selectedCard"
              [class.selectable-pile]="pile.selectablePile"
              [class.selected-pile]="pile.selectedPile"
              [class.way-selectable]="pile.waySelectable"
              (click)="onPileClick(pile, $event)"
              (mouseenter)="onPileMouseEnter(pile, $event)"
              (mouseleave)="onPileMouseLeave(pile)"
            >
              @if (pile.cardId !== null) {
                <app-card
                  [cardId]="pile.cardId"
                  [size]="'half'"
                  [forceFacing]="'front'"
                ></app-card>
              } @else {
                <div class="empty-pile">Empty</div>
              }
              <div class="pile-indicators">
                <div class="pile-count-badge">{{ pile.count }}</div>
                @if (pile.tokenBadgeStacks.length > 0) {
                  <div class="pile-token-badges">
                    @for (stack of pile.tokenBadgeStacks; track stack.id) {
                      <div class="pile-token-badge-stack">
                        @if (stack.imagePath) {
                          <div class="pile-token-badge-image">
                            <img [src]="stack.imagePath" alt="" />
                            <span class="pile-token-badge-image-count">{{ stack.count }}</span>
                          </div>
                        } @else {
                          <div class="pile-token-badge" [style.background]="stack.color">
                            {{ stack.label }}
                          </div>
                          @if (stack.count > 1) {
                            <div class="pile-token-badge-count">{{ stack.count }}</div>
                          }
                        }
                      </div>
                    }
                  </div>
                }
                @if (pile.tokenChips.length > 0) {
                  <div class="pile-token-chips">
                    @for (chip of pile.tokenChips; track chip.id) {
                      <div class="pile-token-chip">
                        <img [src]="chip.imagePath" alt="" />
                        <span [style.color]="chip.textColor">{{ chip.count }}</span>
                      </div>
                    }
                  </div>
                }
              </div>
              <div class="cost-overlay">
                <div class="cost-chip">
                  <img src="/assets/ui-icons/coin.png" alt="" />
                  <span>{{ pile.treasureCost }}</span>
                </div>
                @if (pile.potionCost > 0) {
                  <div class="cost-chip">
                    <img src="/assets/ui-icons/potion.png" alt="" />
                    @if (pile.potionCost > 1) { <span>{{ pile.potionCost }}</span> }
                  </div>
                }
                @if (pile.debtCost > 0) {
                  <div class="cost-chip">
                    <img src="/assets/ui-icons/debt-icon.png" alt="" />
                    <span>{{ pile.debtCost }}</span>
                  </div>
                }
              </div>
              @if (pile.trait) {
                <div class="pile-trait-tag" (contextmenu)="onTraitContextMenu($event, pile)">
                  {{ pile.trait.cardName }}
                </div>
              }
            </button>
          }
        </div>

        <div class="pile-column">
          @for (pile of basicTreasurePiles(); track pile.trackKey) {
            <button
              type="button"
              class="supply-pile"
              [class.selectable-card]="pile.selectableCard"
              [class.selected-card]="pile.selectedCard"
              [class.selectable-pile]="pile.selectablePile"
              [class.selected-pile]="pile.selectedPile"
              [class.way-selectable]="pile.waySelectable"
              (click)="onPileClick(pile, $event)"
              (mouseenter)="onPileMouseEnter(pile, $event)"
              (mouseleave)="onPileMouseLeave(pile)"
            >
              @if (pile.cardId !== null) {
                <app-card
                  [cardId]="pile.cardId"
                  [size]="'half'"
                  [forceFacing]="'front'"
                ></app-card>
              } @else {
                <div class="empty-pile">Empty</div>
              }
              <div class="pile-indicators">
                <div class="pile-count-badge">{{ pile.count }}</div>
                @if (pile.tokenBadgeStacks.length > 0) {
                  <div class="pile-token-badges">
                    @for (stack of pile.tokenBadgeStacks; track stack.id) {
                      <div class="pile-token-badge-stack">
                        @if (stack.imagePath) {
                          <div class="pile-token-badge-image">
                            <img [src]="stack.imagePath" alt="" />
                            <span class="pile-token-badge-image-count">{{ stack.count }}</span>
                          </div>
                        } @else {
                          <div class="pile-token-badge" [style.background]="stack.color">
                            {{ stack.label }}
                          </div>
                          @if (stack.count > 1) {
                            <div class="pile-token-badge-count">{{ stack.count }}</div>
                          }
                        }
                      </div>
                    }
                  </div>
                }
                @if (pile.tokenChips.length > 0) {
                  <div class="pile-token-chips">
                    @for (chip of pile.tokenChips; track chip.id) {
                      <div class="pile-token-chip">
                        <img [src]="chip.imagePath" alt="" />
                        <span [style.color]="chip.textColor">{{ chip.count }}</span>
                      </div>
                    }
                  </div>
                }
              </div>
              <div class="cost-overlay">
                <div class="cost-chip">
                  <img src="/assets/ui-icons/coin.png" alt="" />
                  <span>{{ pile.treasureCost }}</span>
                </div>
                @if (pile.potionCost > 0) {
                  <div class="cost-chip">
                    <img src="/assets/ui-icons/potion.png" alt="" />
                    @if (pile.potionCost > 1) { <span>{{ pile.potionCost }}</span> }
                  </div>
                }
                @if (pile.debtCost > 0) {
                  <div class="cost-chip">
                    <img src="/assets/ui-icons/debt-icon.png" alt="" />
                    <span>{{ pile.debtCost }}</span>
                  </div>
                }
              </div>
              @if (pile.trait) {
                <div class="pile-trait-tag" (contextmenu)="onTraitContextMenu($event, pile)">
                  {{ pile.trait.cardName }}
                </div>
              }
            </button>
          }
        </div>
      </div>
    </section>

    <section
      class="supply-panel"
      [style.left.px]="layout.kingdomLeft"
      [style.top.px]="layout.kingdomTop"
    >
      <div class="kingdom-grid">
        @for (pile of kingdomPiles(); track pile.trackKey) {
          <button
            type="button"
            class="supply-pile"
            [class.selectable-card]="pile.selectableCard"
            [class.selected-card]="pile.selectedCard"
            [class.selectable-pile]="pile.selectablePile"
            [class.selected-pile]="pile.selectedPile"
            [class.way-selectable]="pile.waySelectable"
            (click)="onPileClick(pile, $event)"
            (mouseenter)="onPileMouseEnter(pile, $event)"
            (mouseleave)="onPileMouseLeave(pile)"
          >
            @if (pile.cardId !== null) {
              <app-card
                [cardId]="pile.cardId"
                [size]="'half'"
                [forceFacing]="'front'"
              ></app-card>
            } @else {
              <div class="empty-pile">Empty</div>
            }
            <div class="pile-indicators">
              <div class="pile-count-badge">{{ pile.count }}</div>
              @if (pile.tokenBadgeStacks.length > 0) {
                <div class="pile-token-badges">
                  @for (stack of pile.tokenBadgeStacks; track stack.id) {
                    <div class="pile-token-badge-stack">
                      @if (stack.imagePath) {
                        <div class="pile-token-badge-image">
                          <img [src]="stack.imagePath" alt="" />
                          <span class="pile-token-badge-image-count">{{ stack.count }}</span>
                        </div>
                      } @else {
                        <div class="pile-token-badge" [style.background]="stack.color">
                          {{ stack.label }}
                        </div>
                        @if (stack.count > 1) {
                          <div class="pile-token-badge-count">{{ stack.count }}</div>
                        }
                      }
                    </div>
                  }
                </div>
              }
              @if (pile.tokenChips.length > 0) {
                <div class="pile-token-chips">
                  @for (chip of pile.tokenChips; track chip.id) {
                    <div class="pile-token-chip">
                      <img [src]="chip.imagePath" alt="" />
                      <span [style.color]="chip.textColor">{{ chip.count }}</span>
                    </div>
                  }
                </div>
              }
            </div>
            <div class="cost-overlay">
              <div class="cost-chip">
                <img src="/assets/ui-icons/coin.png" alt="" />
                <span>{{ pile.treasureCost }}</span>
              </div>
              @if (pile.potionCost > 0) {
                <div class="cost-chip">
                  <img src="/assets/ui-icons/potion.png" alt="" />
                  @if (pile.potionCost > 1) { <span>{{ pile.potionCost }}</span> }
                </div>
              }
              @if (pile.debtCost > 0) {
                <div class="cost-chip">
                  <img src="/assets/ui-icons/debt-icon.png" alt="" />
                  <span>{{ pile.debtCost }}</span>
                </div>
              }
            </div>
            @if (pile.trait) {
              <div class="pile-trait-tag" (contextmenu)="onTraitContextMenu($event, pile)">
                {{ pile.trait.cardName }}
              </div>
            }
          </button>
        }
      </div>
    </section>
  </div>
}
