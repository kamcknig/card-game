<div class="score-panel">
  <div class="player-scores-container">
    @for (playerScore of orderedPlayerScores(); track playerScore.id) {
        @let isCurrentPlayer = currentPlayerTurnId() === playerScore.id;
        <div
          class="player-score-row"
          [ngClass]="{'current-player': isCurrentPlayer}"
          [style.--player-accent]="playerScore.accentColor"
          [style.--player-accent-soft]="playerScore.accentSoft"
          [style.--player-accent-muted]="playerScore.accentMuted"
          [style.--player-accent-active-strong]="playerScore.accentActiveStrong"
          [style.--player-accent-active-soft]="playerScore.accentActiveSoft"
          [style.--player-accent-glow]="playerScore.accentGlow"
          [style.--player-accent-dot-inactive]="playerScore.accentDotInactive"
          [style.--player-accent-dot-active]="playerScore.accentDotActive"
        >
          <span class="player-accent-dot" aria-hidden="true"></span>

          <div class="player-main">
            <span class="player-name">{{ playerScore.name }}</span>
            <span class="score-value">{{ playerScore.score }} VP</span>
          </div>
        </div>
    }
  </div>
</div>
