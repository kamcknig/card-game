server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers injected at container start (see docker/env.sh).
    # The file is generated dynamically so the CSP connect-src directive
    # can include the runtime WS_HOST value without rebuilding the image.
    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
