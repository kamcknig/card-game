<app-scene-content>
  <div class="login-container">
    <!-- Mode toggle — Phase 5 adds register alongside sign in. -->
    <div class="login-mode-toggle" role="tablist" aria-label="Auth mode">
      <button
        type="button"
        class="login-mode-button"
        [class.is-active]="mode() === 'signin'"
        (click)="setMode('signin')"
        role="tab"
        [attr.aria-selected]="mode() === 'signin'"
      >
        Sign In
      </button>
      <button
        type="button"
        class="login-mode-button"
        [class.is-active]="mode() === 'register'"
        (click)="setMode('register')"
        role="tab"
        [attr.aria-selected]="mode() === 'register'"
      >
        Register
      </button>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <label class="login-field">
        <span class="login-label">Username</span>
        <input
          type="text"
          class="login-input"
          [value]="username()"
          (input)="username.set($any($event.target).value)"
          autocomplete="username"
          autofocus
        />
      </label>

      <label class="login-field">
        <span class="login-label">Password</span>
        <div class="login-input-wrapper">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            class="login-input"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            [attr.autocomplete]="mode() === 'signin' ? 'current-password' : 'new-password'"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleShowPassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            @if (showPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </label>

      @if (mode() === 'register') {
        <label class="login-field">
          <span class="login-label">Registration code</span>
          <input
            type="text"
            class="login-input"
            [value]="registrationCode()"
            (input)="registrationCode.set($any($event.target).value)"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
      }

      @if (errorMessage(); as error) {
        <p class="login-error">{{ error }}</p>
      }

      @if (successMessage(); as success) {
        <p class="login-success">{{ success }}</p>
      }

      <button
        type="submit"
        class="login-button"
        [disabled]="isSubmitting()"
      >
        @if (mode() === 'signin') {
          Login
        } @else {
          Create account
        }
      </button>
    </form>
  </div>
</app-scene-content>
