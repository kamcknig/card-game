# Deploys updated Docker images to Azure Container Apps after a successful
# component-scoped Build and Push run. The router job extracts the
# component (`server` or `frontend`) and the stripped semver from the
# release tag, and the matching deploy job pushes that one image to its
# Container App. Tags that match neither prefix produce a no-op router
# output so deploy jobs are skipped cleanly.
name: Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed

jobs:
  resolve-tag:
    name: Resolve component and version from tag
    runs-on: ubuntu-latest
    # Only run when the upstream build-and-push workflow succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      # For release-triggered upstream runs, head_branch is the tag name
      # (e.g., server-v1.2.3). Strip the component prefix so deploy jobs
      # can reference the bare semver as the image tag.
      - name: Parse tag
        id: parse
        run: |
          TAG='${{ github.event.workflow_run.head_branch }}'
          if [[ "$TAG" == server-v* ]]; then
            echo "component=server"  >> "$GITHUB_OUTPUT"
            echo "version=${TAG#server-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == frontend-v* ]]; then
            echo "component=frontend" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#frontend-v}" >> "$GITHUB_OUTPUT"
          else
            echo "component=" >> "$GITHUB_OUTPUT"
            echo "version="   >> "$GITHUB_OUTPUT"
          fi

  deploy-server:
    name: Deploy server container app
    needs: resolve-tag
    if: needs.resolve-tag.outputs.component == 'server'
    runs-on: ubuntu-latest
    # Force Node.js 24 for actions that don't yet have a Node 24 native release (azure/container-apps-deploy-action).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploys the release-tagged server image to the dominion-clone-server container app.
      # Using a unique release tag (instead of `latest`) ensures Azure creates a new revision.
      - name: Deploy server container app
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.AZURE_SERVER_APP_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-server:${{ needs.resolve-tag.outputs.version }}
          registryUrl: ${{ secrets.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}

      # Logs the active revision name for the server app to confirm deployment.
      - name: Verify server deployment
        run: |
          az containerapp show \
            --name ${{ secrets.AZURE_SERVER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.latestRevisionName" -o tsv

  deploy-frontend:
    name: Deploy frontend container app
    needs: resolve-tag
    if: needs.resolve-tag.outputs.component == 'frontend'
    runs-on: ubuntu-latest
    # Force Node.js 24 for actions that don't yet have a Node 24 native release (azure/container-apps-deploy-action).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploys the release-tagged frontend image to the dominion-clone-frontend container app.
      - name: Deploy frontend container app
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-frontend:${{ needs.resolve-tag.outputs.version }}
          registryUrl: ${{ secrets.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}

      # Rebinds the custom domain after each frontend deploy. The deploy action
      # creates a new revision which clears the custom domain binding, so this
      # step restores it using the existing CNAME record for validation.
      - name: Rebind frontend custom domain
        run: |
          az containerapp hostname bind \
            --name ${{ secrets.AZURE_FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --hostname ${{ secrets.AZURE_FRONTEND_HOSTNAME }} \
            --environment ${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }} \
            --validation-method CNAME

      # Logs the active revision name for the frontend app to confirm deployment.
      - name: Verify frontend deployment
        run: |
          az containerapp show \
            --name ${{ secrets.AZURE_FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.latestRevisionName" -o tsv
