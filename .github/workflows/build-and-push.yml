# Builds the server and frontend Docker images and pushes them to Azure Container
# Registry on every push to master that touches relevant source paths.
name: Build and Push Docker Images

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - 'shared/**'
      - 'angular-frontend/**'
      - 'docker/**'
      - '.github/workflows/build-and-push.yml'

jobs:
  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Generates two tags: a short SHA tag for traceability and `latest` for
      # deployment convenience.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-server
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/DockerFile_server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Generates two tags: a short SHA tag for traceability and `latest` for
      # deployment convenience.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/dominion-clone-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/DockerFile_web_app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
