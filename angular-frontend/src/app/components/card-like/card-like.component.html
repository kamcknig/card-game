<!-- Card-like art display. Image carries the printed name/cost/type artwork;
     the bottom accent strip echoes the portrait card type bar treatment so
     events / projects / ways read consistently with kingdom cards. -->
<div
  class="card-like-frame"
  [style]="'--card-like-accent: ' + kindAccent() + '; --card-like-width: ' + imageWidth() + 'px'"
  (contextmenu)="onContextMenu($event)"
>
  <img
    class="card-like-image"
    [src]="path() ?? ''"
    (error)="onImageError()"
    [width]="imageWidth()"
    alt=""
  />
  @if (showAccentStrip()) {
    <div class="card-like-accent-strip"></div>
  }
</div>
