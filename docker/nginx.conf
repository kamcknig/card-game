# Frontend nginx config. Backend upstream is the compose service `server`
# on its internal port 3000 — the browser only ever talks to this nginx
# origin, so wsHost in env.js is left as ''. nginx reverse-proxies the
# backend-bound paths (/auth/, /socket.io/, /debug/, /status) so the SPA
# can issue relative-URL requests and avoid CORS entirely.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. CSP connect-src is 'self' because nginx proxies
    # all backend traffic, keeping everything same-origin in the browser.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Auth API: forwards /auth/* (login, logout, sessions, register) to
    # the game server. Same-origin to the browser, so no CORS preflight.
    location /auth/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO: needs Upgrade/Connection for the WebSocket handoff and
    # an extended read timeout so idle game connections are not dropped.
    location /socket.io/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Debug routes (/debug/match-state and friends). Backend gates these
    # on admin auth; nginx just forwards.
    location /debug/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoint. Exact-match so it never collides with the SPA
    # fallback below.
    location = /status {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for client-side routes — must come AFTER the proxy
    # locations above so /auth, /socket.io, /debug, /status are matched
    # first.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
