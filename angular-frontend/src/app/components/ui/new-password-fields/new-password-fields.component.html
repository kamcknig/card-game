<label class="form-field">
  <span class="form-label">{{ primaryLabel() }}</span>
  <div class="form-input-wrapper">
    <input
      [type]="showPassword() ? 'text' : 'password'"
      class="form-input"
      [value]="primary()"
      (input)="primary.set($any($event.target).value)"
      [attr.autocomplete]="primaryAutocomplete()"
    />
    <button
      type="button"
      class="form-input-toggle"
      (click)="toggleShowPassword()"
      [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
    >
      @if (showPassword()) {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      }
    </button>
  </div>
</label>

<label class="form-field">
  <span class="form-label">{{ confirmLabel() }}</span>
  <input
    [type]="showPassword() ? 'text' : 'password'"
    class="form-input"
    [value]="confirm()"
    (input)="confirm.set($any($event.target).value)"
    [disabled]="primary().length === 0"
    [attr.autocomplete]="confirmAutocomplete()"
  />
  @if (mismatch()) {
    <p class="form-field-error">Passwords do not match</p>
  }
</label>
