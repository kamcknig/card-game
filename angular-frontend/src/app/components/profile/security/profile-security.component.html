<section class="security-section" aria-label="Security settings">
  <h2 class="section-title">Security settings</h2>

  <section class="change-password-section">
    <h3>Change password</h3>
    <form class="change-password-form" (ngSubmit)="submitChangePassword()">
      <label class="form-field">
        <span class="form-label">Current password</span>
        <input
          type="password"
          class="form-input"
          [value]="currentPassword()"
          (input)="currentPassword.set($any($event.target).value)"
          autocomplete="current-password"
        />
      </label>
      <app-new-password-fields
        [(primary)]="newPassword"
        [(confirm)]="confirmNewPassword"
        primaryLabel="New password"
        confirmLabel="Confirm new password"
        primaryAutocomplete="new-password"
        confirmAutocomplete="new-password"
      />
      @if (changePasswordError(); as err) {
        <p class="form-field-error">{{ err }}</p>
      }
      @if (changePasswordSuccess(); as msg) {
        <p class="form-success">{{ msg }}</p>
      }
      <div class="form-actions">
        <button
          type="submit"
          class="panel-button"
          [disabled]="changePasswordSubmitting() || !!newPasswordFields()?.mismatch() || confirmNewPassword().length === 0"
        >
          Update password
        </button>
      </div>
    </form>
  </section>

</section>
