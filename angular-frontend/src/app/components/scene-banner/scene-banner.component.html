<header class="scene-banner-header">
  <div class="scene-banner" role="img" aria-label="Dominion Clone banner">
    <h1>Dominion Clone</h1>
    @if (subtitle()) {
      <p>{{ subtitle() }}</p>
    }
  </div>

  <!-- Project scene-specific actions (e.g. Leave Game) into the banner header. -->
  <div class="scene-banner-actions">
    <ng-content></ng-content>
    <app-theme-toggle />
    @if (username()) {
      <app-profile-menu />
    }
  </div>
</header>
