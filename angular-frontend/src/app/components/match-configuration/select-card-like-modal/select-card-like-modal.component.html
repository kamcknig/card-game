<div class="modal-container">
  <div class="card-content">
    <!-- Close button for the landscape selection modal -->
    <div (click)="searchTermInput.value = ''; onClose()" class="close-button">X</div>
    <div class="card-container">
      @for (item of displaySearchResults(); track item.cardKey) {
        <img
          (click)="onItemSelected(item); searchTermInput.value = ''"
          [ngSrc]="item.imagePath"
          [height]="item.imageHeight"
          [width]="item.imageWidth"
          class="card-image">
      }

      @if (shouldShowNoResults()) {
        <div class="no-results">No matching results.</div>
      }
    </div>
  </div>

  <!-- Search input for landscapes -->
  <input
    #searchTermInput
    autofocus
    (input)="updateSearchTerm(searchTermInput.value)"
    type="text">
</div>
